<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Exposicion para GDS Div #342-2</title>
</head>
<body>
    <h3 id="envBadge">Entorno: Cargando...</h3>
    <h1>Lista de Usuarios</h1>
    <p>¡Bienvenido a la gestion de usuarios!</p>
    <input type="text" id="taskInput" placeholder="Nueva tarea...">
    <button onclick="addTask()">Agregar Usuarios</button>
    <ul id="taskList"></ul>

    <script>
        const API_URL = '/api/tasks';
        const ENV_URL = '/api/entorno';

        async function fetchEntorno() {
            try {
                const res = await fetch(ENV_URL);
                const data = await res.json();
                document.getElementById('envBadge').textContent = `Entorno: ${data.entorno}`;
            } catch (err) {
                document.getElementById('envBadge').textContent = 'Entorno: Desconectado';
            }
        }

        async function fetchTasks() {
            const res = await fetch(API_URL);
            const tasks = await res.json();
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach(t => {
                const li = document.createElement('li');
                li.textContent = t.title;
                list.appendChild(li);
            });
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value) return;
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value })
            });
            input.value = '';
            fetchTasks();
        }

        // Carga inicial
        fetchEntorno();
        fetchTasks();
    </script>
</body>
</html>
